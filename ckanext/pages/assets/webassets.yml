# Core functionality JS bundle - CKEditor and basic form functionality
main-js:
  filters: rjsmin
  output: ckanext-pages/%(version)s_main.js
  extra:
    preload:
      - base/main
  contents:
    - vendor/ckeditor/adapters/jquery.js
    - vendor/datepicker/js/bootstrap-datepicker.js
    - js/ckedit.js
    - js/datepicker.js
    - js/data-initialization.js
    - js/organization-loader.js

# Core functionality CSS bundle
main-css:
  output: ckanext-pages/%(version)s_main.css
  filters: cssrewrite
  contents:
    - vendor/datepicker/css/datepicker.css
    - css/ckedit.css

# Medium editor bundle
medium-js:
  filters: rjsmin
  output: ckanext-pages/%(version)s_medium.js
  extra:
    preload:
      - base/main
  contents:
    - vendor/medium/medium-editor.js
    - js/pages-editor.js

medium-css:
  output: ckanext-pages/%(version)s_medium.css
  filters: cssrewrite
  contents:
    - vendor/medium/medium-editor.css
    - css/bootstrap.css

# Page-specific CSS bundles
blog-css:
  output: ckanext-pages/%(version)s_blog.css
  filters: cssrewrite
  contents:
    - css/blog.css

index-css:
  output: ckanext-pages/%(version)s_pages.css
  filters: cssrewrite
  contents:
    - css/pages.css

rapid-response-css:
  output: ckanext-pages/%(version)s_rapid-response.css
  filters: cssrewrite
  contents:
    - css/rapid-response.css

# Open Source Software functionality
open-source-software-js:
  filters: rjsmin
  output: ckanext-pages/%(version)s_open-source-software.js
  extra:
    preload:
      - base/main
  contents:
    - js/open-source-software-edit.js
    - js/image-upload.js
    - js/member-states.js

open-source-software-css:
  output: ckanext-pages/%(version)s_open-source-software.css
  filters: cssrewrite
  contents:
    - css/open-source-software-edit.css

# Quill editor functionality
quill-js:
  filters: rjsmin
  output: ckanext-pages/%(version)s_quill.js
  extra:
    preload:
      - base/main
  contents:
    - js/quill-editor-manager.js

