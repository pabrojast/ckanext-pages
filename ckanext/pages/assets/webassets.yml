main-js:
  filters: rjsmin
  output: ckanext-pages/%(version)s_main.js
  extra:
    preload:
      - base/main
  contents:
    - vendor/ckeditor/adapters/jquery.js
    - vendor/datepicker/js/bootstrap-datepicker.js
    - js/ckedit.js
    - js/datepicker.js

main-css:
  output: ckanext-pages/%(version)s_main.css
  filters: cssrewrite
  contents:
    - vendor/datepicker/css/datepicker.css
    - css/ckedit.css

medium-js:
  filters: rjsmin
  output: ckanext-pages/%(version)s_medium.js
  extra:
    preload:
      - base/main
  contents:
    - vendor/medium/medium-editor.js
    - js/pages-editor.js

medium-css:
  output: ckanext-pages/%(version)s_medium.css
  filters: cssrewrite
  contents:
    - vendor/medium/medium-editor.css
    - css/bootstrap.css

blog-css:
  output: ckanext-pages/%(version)s_blog.css
  filters: cssrewrite
  contents:
    - css/blog.css

index-css:
  output: ckanext-pages/%(version)s_pages.css
  filters: cssrewrite
  contents:
    - css/pages.css

rapid-response-css:
  output: ckanext-pages/%(version)s_rapid-response.css
  filters: cssrewrite
  contents:
    - css/rapid-response.css

open-source-software-edit-css:
  output: ckanext-pages/%(version)s_open-source-software-edit.css
  filters: cssrewrite
  contents:
    - css/open-source-software-edit.css

open-source-software-edit-js:
  filters: rjsmin
  output: ckanext-pages/%(version)s_open-source-software-edit.js
  extra:
    preload:
      - base/main
  contents:
    - js/data-initialization.js
    - js/open-source-software-edit.js
    - js/organization-loader.js
    - js/member-states.js
    - js/image-upload.js
    - js/quill-editor-manager.js

