{% ckan_extends %}

{% block header_account_logged %}
  {% set pending_count = h.get_pending_approval_count() %}
  {% if pending_count %}
  <li>
    <a href="{{ h.url_for('pages.water_admin') }}" title="{{ _('Pending approvals') }}" style="position: relative;">
      <i class="fa fa-bell"></i>
      <span style="position: absolute; top: 2px; right: 0; background: #dc3545; color: #fff; border-radius: 50%; font-size: 10px; min-width: 16px; height: 16px; line-height: 16px; text-align: center; padding: 0 3px;">{{ pending_count }}</span>
    </a>
  </li>
  {% endif %}
  <li>
    <a href="{{ h.url_for('pages.pages_index') }}" title="{{ _('Pages') }}">
      <i class="fa fa-file icon-file"></i>
    </a>
  </li>
  <li>
    <a href="{{ h.url_for('pages.blog_index') }}" title="{{ _('Blog') }}">
      <i class="fa fa-pencil icon-pencil"></i>
    </a>
  </li>
  {{ super() }}
{% endblock %}
