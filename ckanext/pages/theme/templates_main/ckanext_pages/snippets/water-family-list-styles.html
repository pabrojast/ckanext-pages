<style>
/* Shared Water Family listing styles derived from rapid-response design */
.water-family-list {
  --wf-primary: #0072BC;
  --wf-primary-dark: #005A9C;
  --wf-primary-light: #009EE0;
  --wf-accent: #F0F7FD;
  --wf-accent-strong: #E3F1FB;
  --wf-muted: #6C757D;
  --wf-text: #2C3E50;
  --wf-border: #E1E7EF;
  --wf-shadow-light: 0 12px 32px rgba(0, 114, 188, 0.12);
  --wf-shadow-strong: 0 18px 48px rgba(0, 114, 188, 0.18);
}

.water-family-list .section-title {
  position: relative;
  height: 320px;
  overflow: hidden;
  border-radius: 16px;
  margin-bottom: 3rem;
  box-shadow: var(--wf-shadow-strong);
}

.water-family-list .section-title-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.8);
}

.water-family-list .section-title-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(0, 114, 188, 0.92) 0%, rgba(0, 74, 137, 0.85) 100%);
}

.water-family-list .section-title-content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #fff;
  z-index: 2;
  max-width: 820px;
  padding: 0 1.5rem;
}

.water-family-list .section-title-content h1 {
  font-size: 3rem;
  font-weight: 700;
  margin-bottom: 0.75rem;
}

.water-family-list .section-title-description {
  font-size: 1.2rem;
  opacity: 0.92;
}

/* Action bar & filters */
.water-family-list .wf-actions-bar .module,
.water-family-list .wf-filters .module,
.water-family-list .wf-status-summary .module,
.water-family-list .wf-empty-state .module {
  background: linear-gradient(135deg, rgba(240, 247, 253, 0.95) 0%, rgba(227, 241, 251, 0.95) 100%);
  border: 1px solid var(--wf-border);
  border-radius: 20px;
  box-shadow: var(--wf-shadow-light);
}

.water-family-list .wf-actions-bar h2,
.water-family-list .wf-filters h2 {
  margin: 0;
  font-weight: 700;
  color: var(--wf-text);
}

.water-family-list .wf-actions-bar p,
.water-family-list .wf-filters p {
  margin: 0.5rem 0 0;
  color: var(--wf-muted);
}

.water-family-list .wf-filters .form-control,
.water-family-list .wf-filters input[type="text"],
.water-family-list .wf-filters select {
  border-radius: 12px;
  border: 1px solid var(--wf-border);
  padding: 0.6rem 0.85rem;
  box-shadow: none;
}

.water-family-list .wf-filters .btn {
  border-radius: 12px;
}

/* Status metrics */
.water-family-list .status-metric {
  padding: 1rem 0.5rem;
}

.water-family-list .status-metric .metric-number {
  font-size: 2.6rem;
  font-weight: 700;
  color: var(--wf-primary);
}

.water-family-list .status-metric .metric-label {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.78rem;
  color: var(--wf-muted);
}

/* Cards */
.water-family-list .wf-card {
  margin-bottom: 2.2rem;
}


.water-family-list .wf-meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem 0.9rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
  font-weight: 600;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.water-family-list .wf-meta-pill i {
  font-size: 0.9rem;
}

.water-family-list .wf-meta-pill.wf-meta-muted {
  background: rgba(44, 62, 80, 0.25);
}

.water-family-list .wf-meta-pill.wf-status-pending {
  background: rgba(255, 193, 7, 0.28);
  color: #fff3cd;
}

.water-family-list .wf-meta-pill.wf-status-draft {
  background: rgba(108, 117, 125, 0.28);
  color: #f1f3f5;
}

.water-family-list .wf-meta-pill.wf-status-published {
  background: rgba(40, 167, 69, 0.32);
  color: #d4f8df;
}

.water-family-list .wf-meta-pill.wf-type-pill {
  background: rgba(255, 255, 255, 0.22);
}
.water-family-list .wf-card .module-modern {
  background: #fff;
  border-radius: 20px;
  border: 1px solid var(--wf-border);
  box-shadow: var(--wf-shadow-light);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  overflow: hidden;
}

.water-family-list .wf-card .module-modern:hover {
  transform: translateY(-4px);
  box-shadow: var(--wf-shadow-strong);
}

.water-family-list .wf-card-header {
  background: linear-gradient(135deg, rgba(0, 114, 188, 0.95) 0%, rgba(0, 74, 137, 0.92) 100%);
  color: #fff;
  padding: 1.35rem 1.9rem;
  border-bottom: none;
}

.water-family-list .wf-card-header a {
  color: #fff;
  text-decoration: none;
}

.water-family-list .wf-card-header a:hover {
  color: #fff;
  text-decoration: underline;
  opacity: 0.9;
}

.water-family-list .wf-card-header i {
  opacity: 0.85;
}

.water-family-list .wf-card-header .event-metadata,
.water-family-list .wf-card-header .news-metadata,
.water-family-list .wf-card-header .publication-metadata {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  align-items: center;
  font-weight: 500;
}

.water-family-list .wf-card-header .event-type,
.water-family-list .wf-card-header .news-type,
.water-family-list .wf-card-header .publication-type {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.85rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.18);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.water-family-list .wf-card-header .event-type .type-label,
.water-family-list .wf-card-header .news-type-badge,
.water-family-list .wf-card-header .publication-type-badge {
  color: #fff;
}

.water-family-list .wf-card .module-content {
  padding: 1.85rem 1.9rem 1.6rem;
}

.water-family-list .wf-card .module-content .row {
  align-items: stretch;
}

.water-family-list .event-image,
.water-family-list .news-image,
.water-family-list .publication-image {
  border-radius: 14px;
  overflow: hidden;
  background: var(--wf-accent);
  height: 210px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 0 1px rgba(0, 114, 188, 0.05);
}

.water-family-list .event-image img,
.water-family-list .news-image img,
.water-family-list .publication-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.water-family-list .wf-card:hover .event-image img,
.water-family-list .wf-card:hover .news-image img,
.water-family-list .wf-card:hover .publication-image img {
  transform: scale(1.05);
}

.water-family-list .placeholder-image {
  color: var(--wf-primary);
  opacity: 0.6;
}

.water-family-list .event-title,
.water-family-list .news-title,
.water-family-list .publication-title {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--wf-text);
  margin-top: 0;
  margin-bottom: 0.75rem;
}

.water-family-list .event-excerpt,
.water-family-list .news-excerpt,
.water-family-list .publication-excerpt {
  color: var(--wf-muted);
  font-size: 1.02rem;
  line-height: 1.6;
}

.water-family-list .event-details-list,
.water-family-list .publication-details-list {
  margin: 1rem 0 0;
  padding: 0;
  list-style: none;
}

.water-family-list .event-details-list li,
.water-family-list .publication-details-list li {
  margin-bottom: 0.35rem;
  color: var(--wf-muted);
  display: flex;
  gap: 0.5rem;
  align-items: flex-start;
}

.water-family-list .event-actions,
.water-family-list .news-actions,
.water-family-list .publication-actions {
  display: flex;
  gap: 0.75rem;
  align-items: center;
  flex-wrap: wrap;
}

.water-family-list .wf-card .meta-pill,
.water-family-list .wf-card .event-status-badge,
.water-family-list .wf-card .news-status-badge,
.water-family-list .wf-card .publication-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.35rem 0.8rem;
  border-radius: 999px;
  background: rgba(0, 114, 188, 0.1);
  color: var(--wf-primary);
  font-size: 0.78rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.water-family-list .wf-card .status-pending {
  background: rgba(255, 193, 7, 0.18);
  color: #b98900;
}

.water-family-list .wf-card .status-draft {
  background: rgba(108, 117, 125, 0.18);
  color: rgba(44, 62, 80, 0.8);
}

.water-family-list .wf-card .status-published,
.water-family-list .wf-card .status-approved {
  background: rgba(40, 167, 69, 0.18);
  color: #1b7c36;
}

/* Buttons */
.water-family-list .btn-primary {
  background: linear-gradient(135deg, var(--wf-primary) 0%, var(--wf-primary-dark) 100%);
  border: none;
  border-radius: 14px;
  padding: 0.65rem 1.35rem;
  box-shadow: 0 10px 24px rgba(0, 114, 188, 0.25);
  color: #fff;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.water-family-list .btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 32px rgba(0, 114, 188, 0.32);
  color: #fff;
}

.water-family-list .btn-default {
  border-radius: 14px;
  border: 1px solid var(--wf-border);
  background: #fff;
  color: var(--wf-text);
  padding: 0.6rem 1.2rem;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
}

.water-family-list .btn-default:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(0, 114, 188, 0.12);
  border-color: var(--wf-primary-light);
  color: var(--wf-primary-dark);
}

/* Pagination */
.water-family-list .pagination-wrapper .module {
  background: linear-gradient(135deg, rgba(240, 247, 253, 0.95) 0%, rgba(227, 241, 251, 0.95) 100%);
  border: 1px solid var(--wf-border);
  border-radius: 16px;
  box-shadow: var(--wf-shadow-light);
}

/* Empty state */
.water-family-list .wf-empty-state {
  text-align: center;
  color: var(--wf-muted);
}

.water-family-list .wf-empty-state i {
  font-size: 3rem;
  color: var(--wf-primary-light);
  margin-bottom: 1rem;
}

/* Rapid Response inspired styles for consistent list design */
.event-card-modern {
  transition: all 0.3s ease;
}

.module-modern {
  background: #fff;
  border: none;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0, 114, 188, 0.08);
  transition: all 0.3s ease;
  overflow: hidden;
}

.module-modern:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0, 114, 188, 0.15);
}

.event-card-content {
  padding: 1.5rem;
}

.event-image-container {
  width: 100%;
  height: 120px;
  border-radius: 12px;
  overflow: hidden;
  background: #f8f9fa;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(0, 114, 188, 0.08);
}

.event-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.event-card-modern:hover .event-image {
  transform: scale(1.05);
}

.placeholder-image {
  color: var(--wf-primary);
  text-align: center;
  opacity: 0.6;
}

.event-info {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.event-header-compact {
  margin-bottom: 1rem;
}

.event-title-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 0.75rem;
  gap: 1rem;
}

.event-title-modern {
  font-size: 1.4rem;
  font-weight: 700;
  margin: 0;
  color: var(--wf-text);
  line-height: 1.3;
}

.event-title-modern a {
  color: inherit;
  text-decoration: none;
  transition: color 0.2s ease;
}

.event-title-modern a:hover {
  color: var(--wf-primary);
  text-decoration: none;
}

.event-badges {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.badge-status {
  display: inline-flex;
  align-items: center;
  padding: 0.3rem 0.75rem;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.badge-news {
  background: rgba(23, 162, 184, 0.15);
  color: #117a8b;
}

.badge-event {
  background: rgba(40, 167, 69, 0.15);
  color: #1b7c36;
}

.badge-publication {
  background: rgba(102, 16, 242, 0.15);
  color: #6610f2;
}

.badge-pending {
  background: rgba(255, 193, 7, 0.18);
  color: #b98900;
}

.badge-draft {
  background: rgba(108, 117, 125, 0.18);
  color: #6c757d;
}

.badge-published {
  background: rgba(40, 167, 69, 0.18);
  color: #1b7c36;
}

.event-meta-compact {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 0.5rem;
}

.meta-item {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.85rem;
  color: var(--wf-muted);
}

.meta-item i {
  font-size: 0.8rem;
  opacity: 0.7;
}

.event-description-modern {
  flex-grow: 1;
  margin-bottom: 1rem;
}

.key-info-compact {
  margin-bottom: 0.75rem;
}

.key-info-item {
  background: rgba(0, 114, 188, 0.05);
  border-left: 3px solid var(--wf-primary);
  padding: 0.4rem 0.75rem;
  margin-bottom: 0.4rem;
  font-size: 0.85rem;
  border-radius: 0 6px 6px 0;
}

.event-excerpt-modern {
  color: var(--wf-muted);
  line-height: 1.5;
}

.read-more-btn {
  padding: 0;
  color: var(--wf-primary);
  text-decoration: none;
  font-size: 0.8rem;
  border: none;
  background: none;
}

.read-more-btn:hover {
  color: var(--wf-primary-dark);
  text-decoration: underline;
}

.event-actions-modern {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
}

.impact-info-modern {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.impact-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.25rem 0.6rem;
  border-radius: 16px;
  font-size: 0.7rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.impact-news {
  background: rgba(23, 162, 184, 0.12);
  color: #117a8b;
}

.impact-event {
  background: rgba(40, 167, 69, 0.12);
  color: #1b7c36;
}

.impact-publication {
  background: rgba(102, 16, 242, 0.12);
  color: #6610f2;
}

.impact-registration,
.impact-online {
  background: rgba(40, 167, 69, 0.12);
  color: #1b7c36;
}

.impact-download {
  background: rgba(23, 162, 184, 0.12);
  color: #117a8b;
}

.action-buttons-modern {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.action-buttons-modern .btn {
  border-radius: 12px;
  padding: 0.4rem 0.8rem;
  font-size: 0.8rem;
  font-weight: 500;
  border: none;
  transition: all 0.2s ease;
}

.action-buttons-modern .btn-sm {
  padding: 0.35rem 0.7rem;
}

.action-buttons-modern .btn-primary {
  background: linear-gradient(135deg, var(--wf-primary) 0%, var(--wf-primary-dark) 100%);
  color: #fff;
  box-shadow: 0 4px 12px rgba(0, 114, 188, 0.2);
}

.action-buttons-modern .btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(0, 114, 188, 0.25);
  color: #fff;
}

.action-buttons-modern .btn-success {
  background: linear-gradient(135deg, #28a745 0%, #20a038 100%);
  color: #fff;
  box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
}

.action-buttons-modern .btn-success:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(40, 167, 69, 0.25);
  color: #fff;
}

.action-buttons-modern .btn-info {
  background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);
  color: #fff;
  box-shadow: 0 4px 12px rgba(23, 162, 184, 0.2);
}

.action-buttons-modern .btn-info:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(23, 162, 184, 0.25);
  color: #fff;
}

.action-buttons-modern .btn-default {
  background: #fff;
  color: var(--wf-text);
  border: 1px solid var(--wf-border);
  box-shadow: 0 2px 8px rgba(0, 114, 188, 0.08);
}

.action-buttons-modern .btn-default:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0, 114, 188, 0.12);
  border-color: var(--wf-primary);
  color: var(--wf-primary);
}

/* Responsive tweaks */
@media (max-width: 992px) {
  .water-family-list .wf-card .module-content {
    padding: 1.5rem;
  }

  .event-card-content {
    padding: 1rem;
  }

  .event-image-container {
    height: 100px;
    margin-bottom: 1rem;
  }

  .event-title-row {
    flex-direction: column;
    gap: 0.5rem;
  }
}

@media (max-width: 768px) {
  .water-family-list .section-title {
    height: 240px;
  }
  .water-family-list .section-title-content h1 {
    font-size: 2.2rem;
  }
  .water-family-list .module-content {
    padding: 1.35rem;
  }
  .water-family-list .wf-card-header,
  .water-family-list .wf-card .module-content .row {
    flex-direction: column;
  }
  .water-family-list .event-image,
  .water-family-list .news-image,
  .water-family-list .publication-image {
    height: 160px;
    margin-bottom: 1rem;
  }
  .water-family-list .event-actions,
  .water-family-list .news-actions,
  .water-family-list .publication-actions {
    flex-direction: column;
    align-items: stretch;
  }
}

@media (max-width: 480px) {
  .water-family-list .section-title {
    height: 200px;
  }
  .water-family-list .section-title-content h1 {
    font-size: 1.85rem;
  }
  .water-family-list .event-title,
  .water-family-list .news-title,
  .water-family-list .publication-title {
    font-size: 1.35rem;
  }
}

/* ── Advanced Filters ── */
.water-family-list .wf-toggle-filters {
  position: relative;
  transition: all 0.2s ease;
}

.water-family-list .wf-toggle-filters.active {
  background: var(--wf-primary);
  color: #fff;
  border-color: var(--wf-primary);
}

.water-family-list .wf-advanced-filters {
  padding-top: 1.2rem;
  margin-top: 1.2rem;
  border-top: 1px solid var(--wf-border);
}

.water-family-list .wf-advanced-filters[style*="block"] {
  animation: wf-slide-down 0.25s ease;
}

@keyframes wf-slide-down {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.water-family-list .wf-filter-label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--wf-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.4rem;
}

.water-family-list .wf-active-chips {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 1rem;
  padding-top: 0.8rem;
  border-top: 1px dashed var(--wf-border);
}

.water-family-list .wf-active-filters-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.35rem 0.85rem;
  background: rgba(0, 114, 188, 0.08);
  border-radius: 50px;
  font-size: 0.78rem;
  color: var(--wf-primary);
  font-weight: 600;
  border: 1px solid rgba(0, 114, 188, 0.12);
}

.water-family-list .wf-active-filters-badge i {
  font-size: 0.7rem;
  opacity: 0.7;
}

@media (max-width: 768px) {
  .water-family-list .wf-advanced-filters .row > [class*="col-"] {
    margin-bottom: 0.75rem;
  }
}

/* ── Source tabs (IHP / Community) ──────────────────────────────── */
.water-family-list .wf-source-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  padding: 0.4rem;
  background: var(--wf-accent);
  border: 1px solid var(--wf-border);
  border-radius: 12px;
}

.water-family-list .wf-source-tab {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.55rem 1.1rem;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.92rem;
  color: var(--wf-text);
  text-decoration: none;
  border: 1px solid transparent;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}

.water-family-list .wf-source-tab:hover {

<script>
document.addEventListener('DOMContentLoaded', function () {
  // Auto-submit filters on change (skip selects inside advanced panel to avoid premature submits)
  document.querySelectorAll('.water-family-list .wf-filters form select').forEach(function (element) {
    if (element.closest('.wf-advanced-filters')) return;
    element.addEventListener('change', function () {
      var form = this.closest('form');
      if (form) {
        form.submit();
      }
    });
  });

  // Toggle advanced filters panel
  document.querySelectorAll('.wf-toggle-filters').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var panel = this.closest('form').querySelector('.wf-advanced-filters');
      if (panel) {
        var isHidden = panel.style.display === 'none' || !panel.style.display;
        panel.style.display = isHidden ? 'block' : 'none';
        this.classList.toggle('active', isHidden);
      }
    });
  });

  // Auto-expand advanced filters if any advanced filter is active
  var urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('initiative') || urlParams.get('member_state')) {
    document.querySelectorAll('.wf-advanced-filters').forEach(function(panel) {
      panel.style.display = 'block';
    });
    document.querySelectorAll('.wf-toggle-filters').forEach(function(btn) {
      btn.classList.add('active');
    });
  }

  // "Read more" functionality for excerpts
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.read-more-btn');
    if (!btn) return;

    e.preventDefault();

    var excerptContainer = btn.closest('.event-excerpt-modern');
    if (!excerptContainer) return;

    var preview = excerptContainer.querySelector('.excerpt-preview');
    var full = excerptContainer.querySelector('.excerpt-full');

    if (!preview || !full) return;

    var isExpanded = full.style.display !== 'none';
    var readMoreLabel = btn.getAttribute('data-read-more') || {{ _('Read more') | tojson }};
    var readLessLabel = btn.getAttribute('data-read-less') || {{ _('Read less') | tojson }};

    if (isExpanded) {
      // Collapse
      preview.style.display = 'inline';
      full.style.display = 'none';
      btn.innerHTML = '<i class="fa fa-plus"></i> ' + readMoreLabel;
    } else {
      // Expand
      preview.style.display = 'none';
      full.style.display = 'inline';
      btn.innerHTML = '<i class="fa fa-minus"></i> ' + readLessLabel;
    }
  });
});
</script>
