              - heading " The 2019 Cyclone Idai" [level=2] [ref=e114]:
                - generic [ref=e115]: 
                - text: The 2019 Cyclone Idai
            - paragraph [ref=e117]: Cyclone Idai ranks among the deadliest 95 storms ever recorded in the southern hemisphere (Devi, 2019). In March 2019, it caused widespread flooding across Mozambique, Malawi, and Zimbabwe, resulting in thousands of fatalities and affecting over three million people – many already in need of humanitarian assistance (Chatiza, 2019). In eastern Zimbabwe, the extreme rainfall (300–450 mm between 15–19 March– nearly half the region’s annual average of ~1000 mm; IMERG-GPM satellite 100 estimates (Huffman et al., 2019)) triggered thousands of highly mobile landslides that severely impacted mountain communities in the Chimanimani and Chipinge districts (e.g., Chatiza, 2019; Chanza et al., 2020).
