        - 'heading "Assessing Catastrophic Landslide Risk in Zimbabwe: Building Resilience in the Wake of Cyclone Idai" [level=1] [ref=e65]'
        - generic [ref=e66]:
          - paragraph
          - paragraph [ref=e67]:
            - text: The
            - strong [ref=e68]: 2019 Tropical Cyclone Idai
            - text: delivered extreme winds and heavy rainfall to Zimbabwe, triggering devastating secondary hazards, most notably extensive landslides and debris-rich flooding in the vulnerable districts of Chimanimani and Chipinge. Although often neglected as a direct consequence of climate change, these landslides caused the loss of hundreds of lives, destroyed critical infrastructure, and impacted
            - strong [ref=e69]: over 270,000 people
            - text: .
          - paragraph [ref=e70]:
            - text: In response to this catastrophe, the UNESCO Regional Office for Southern Africa (ROSA) collaborated with local and international experts to conduct a comprehensive landslide risk assessment, aimed at developing sustainable risk mitigation and disaster management actions to build community resilience. The study successfully mapped and modeled the spatial distribution of
            - strong [ref=e71]: 14,900 Idai-related landslides
            - text: and associated debris-rich floods, categorizing them into landslide source/depletion zones, runout areas, and debris-rich floods. This technical approach utilized remote sensing validated by field missions and models to create high-resolution susceptibility and exposure maps.
          - paragraph [ref=e72]:
            - text: The analysis revealed that
            - strong [ref=e73]: Chimanimani district contains the majority of landslide hotspots
            - text: . Landslide occurrence is driven by geological factors, including deeply weathered dolerites, mudstones and siltstones, and numerous geological weaknesses such as thrusts and faults, which were exploited by the intense rainfall. Furthermore, human activities, including road cuttings, mining, and the development of settlements on unstable slopes and alluvial plains, significantly increase the overall risk to population and infrastructure in these high-susceptibility zones (e.g., Ngangu and Kopa).
          - paragraph [ref=e74]:
            - text: This report provides a vital tool for preventative adaptation policies. Recognizing the increased frequency of hazards under climate variability scenarios, it strongly recommends measures such as
            - strong [ref=e75]: enhanced land-use planning, slope stabilization, and the capacitation and potential resettlement of communities
            - text: to reduce risk. The lessons learned from this comprehensive study in Zimbabwe are designed to be applicable to other vulnerable, data-scarce regions across Africa and worldwide.
          - paragraph
